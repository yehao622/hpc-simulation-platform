# docker-compose.enhanced.yml
# Fixed version with working API Gateway configuration

version: '3.8'

services:
  # Core Services

  # PostgreSQL Database (Fixed)
  postgres:
    image: postgres:14-alpine
    container_name: smartops-postgres
    environment:
      POSTGRES_DB: hpc_simulation
      POSTGRES_USER: hpc_user
      POSTGRES_PASSWORD: hpc_password
      # Add this for admin tasks
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Add init script if exists
      - ./api-gateway/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpc_user -d hpc_simulation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue (Fixed)
  redis:
    image: redis:7-alpine
    container_name: smartops-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Fixed with original working configuration)
  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: smartops-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      # Use the original database connection format
      DATABASE_URL: postgresql://hpc_user:hpc_password@postgres:5432/hpc_simulation
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: debug
      PROMETHEUS_ENABLED: 'true'
    ports:
      - "3000:3000"
    volumes:
      - ./api-gateway/src:/app/src
      - ./api-gateway/package.json:/app/package.json
      - ./api-gateway/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    networks:
      - smartops-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Simulation Worker (Fixed)
  simulation-worker:
    build:
      context: .
      dockerfile: ./simulation-worker/DockerfileAi
    container_name: smartops-simulation-worker
    environment:
      - DATABASE_URL=postgresql://hpc_user:hpc_password@postgres:5432/hpc_simulation
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=2
    volumes:
      - ./simulation-worker/src:/app/src
      - ./results:/app/results
    networks:
      - smartops-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AI Service (Working)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartops-ai-service
    environment:
      - NODE_ENV=development
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Working)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartops-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_AI_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:3000
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
      - ai-service
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: smartops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization Dashboards
  grafana:
    image: grafana/grafana:10.0.0
    container_name: smartops-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=smartops123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: smartops-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - smartops-network

  # Redis Exporter - Redis Metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: smartops-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - smartops-network

  # Postgres Exporter - Database Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.2
    container_name: smartops-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://hpc_user:hpc_password@postgres:5432/hpc_simulation?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - smartops-network

networks:
  smartops-network:
    driver: bridge
    name: smartops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
