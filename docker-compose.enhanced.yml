# docker-compose.enhanced.yml
# Complete SmartOps AI Agent Platform with Monitoring Stack

version: '3.8'

services:
  # Core Services (Enhanced)
  
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: smartops-postgres
    environment:
      POSTGRES_DB: smartops_platform
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD: smartops123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartops -d smartops_platform"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: smartops-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Enhanced API Gateway with Metrics
  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: smartops-api-gateway
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=smartops
      - DB_PASSWORD=smartops123
      - DB_NAME=smartops_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PROMETHEUS_ENABLED=true
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartops-network
    volumes:
      - ./api-gateway/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Simulation Worker with Metrics
  simulation-worker:
    build:
      #context: ./simulation-worker
      context: .
      dockerfile: simulation-worker/DockerfileAi
    container_name: smartops-simulation-worker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=smartops
      - DB_PASSWORD=smartops123
      - DB_NAME=smartops_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartops-network
    volumes:
      - ./simulation-worker/logs:/app/logs
      - ./legacy-simulator:/app/legacy-simulator
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 60s
      timeout: 15s
      retries: 3
      
  # NEW: AI Service (FastAPI + LangChain)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartops-ai-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=smartops
      - DB_PASSWORD=smartops123
      - DB_NAME=smartops_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PROMETHEUS_URL=http://prometheus:9090
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartops-network
    volumes:
      - ./ai-service/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NEW: React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartops-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_AI_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:3000
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
      - ai-service
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: smartops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization Dashboards
  grafana:
    image: grafana/grafana:10.0.0
    container_name: smartops-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=smartops123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: smartops-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - smartops-network

  # Redis Exporter - Redis Metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: smartops-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - smartops-network

  # Postgres Exporter - Database Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.2
    container_name: smartops-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://smartops:smartops123@postgres:5432/smartops_platform?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - smartops-network

networks:
  smartops-network:
    driver: bridge
    name: smartops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
