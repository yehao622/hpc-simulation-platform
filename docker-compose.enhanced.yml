# docker-compose.working.yml
# Simplified working configuration

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: smartops-postgres
    environment:
      POSTGRES_DB: hpc_simulation
      POSTGRES_USER: hpc_user
      POSTGRES_PASSWORD: hpc_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api-gateway/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpc_user -d hpc_simulation"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartops-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Java Data Processor Service - FIXED Configuration
  data-processor:
    build:
      context: ./data-processor
      dockerfile: Dockerfile
    container_name: smartops-data-processor
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: development
      SERVER_PORT: 8080
      
      # Database Configuration - FIXED
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hpc_simulation
      DB_USER: hpc_user
      DB_PASSWORD: hpc_password
      
      # Redis Configuration - FIXED
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      
      # JVM Configuration - OPTIMIZED
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:+UseG1GC -XX:+UseStringDeduplication"
      
      # Application Configuration
      SMARTOPS_ANALYTICS_CACHE_DURATION: 300
      SMARTOPS_METRICS_COLLECTION_INTERVAL: 30
      AI_SERVICE_URL: http://ai-service:8000
      
      # Logging Configuration
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_SMARTOPS: DEBUG
    ports:
      - "8081:8080"
    networks:
      - smartops-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # API Gateway (existing service)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: smartops-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://hpc_user:hpc_password@postgres:5432/hpc_simulation
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: debug
      # Integration with Java service
      DATA_PROCESSOR_URL: http://data-processor:8080/api
    ports:
      - "3000:3000"
    volumes:
      - ./api-gateway/src:/app/src:ro
      - ./api-gateway/package.json:/app/package.json:ro
      - ./api-gateway/tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules
    networks:
      - smartops-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # AI Service (existing service)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartops-ai-service
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 8000
      # Integration with Java service
      DATA_PROCESSOR_URL: http://data-processor:8080/api
      REDIS_URL: redis://redis:6379/2
      LOG_LEVEL: debug
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/src:/app/src:ro
    networks:
      - smartops-network
    depends_on:
      redis:
        condition: service_healthy
      data-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartops-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
      REACT_APP_AI_API_URL: http://localhost:8000
      REACT_APP_DATA_PROCESSOR_URL: http://localhost:8081/api
    ports:
      - "3001:80"
    networks:
      - smartops-network
    depends_on:
      - api-gateway
      - ai-service
      - data-processor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: smartops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - smartops-network
    depends_on:
      - data-processor
      - api-gateway
      - ai-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: smartops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: smartops123
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks:
      - smartops-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Node Exporter for System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: smartops-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"
    networks:
      - smartops-network
    restart: unless-stopped

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks
networks:
  smartops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1