# docker-compose.final.yml
# Fixed configuration for Java service

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: smartops-postgres
    environment:
      POSTGRES_DB: hpc_simulation
      POSTGRES_USER: hpc_user
      POSTGRES_PASSWORD: hpc_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpc_user -d hpc_simulation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartops-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - smartops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Data Processor Service - Simplified Configuration
  data-processor:
    build:
      context: ./data-processor
      dockerfile: Dockerfile
    container_name: smartops-data-processor
    # Remove all environment variables that might cause issues
    ports:
      - "8080:8080"
    networks:
      - smartops-network
    # Remove database dependencies since we're not using them
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: smartops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - smartops-network
    depends_on:
      - data-processor

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: smartops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: smartops123
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    networks:
      - smartops-network
    depends_on:
      - prometheus

# Volumes
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# Networks
networks:
  smartops-network:
    driver: bridge
