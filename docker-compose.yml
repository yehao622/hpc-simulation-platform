version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: hpc-postgres
    environment:
      POSTGRES_DB: hpc_simulation
      POSTGRES_USER: hpc_user
      POSTGRES_PASSWORD: hpc_password
      # Ensure postgres user exists for admin tasks
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Fixed: Use init script instead of schema directly
      - ./api-gateway/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - hpc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpc_user -d hpc_simulation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: hpc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hpc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartops-ai-service
    environment:
      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: hpc_user
      POSTGRES_PASSWORD: hpc_password
      POSTGRES_DB: hpc_simulation
      
      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # AI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: gpt-3.5-turbo
      RAG_CHUNK_SIZE: 1000
      RAG_CHUNK_OVERLAP: 100
      
      # Service configuration
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: info
      
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/chroma_db:/app/chroma_db  # Persist vector database
      - ./ai-service/logs:/app/logs            # Persist logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Allow time for AI initialization
    restart: unless-stopped
    networks:
      - hpc-network
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G      # Increased for LangChain + vector database
    #       cpus: '1.0'
    #     reservations:
    #       memory: 1G
    #       cpus: '0.5'

  data-processor:
    build: 
      context: ./data-processor
      dockerfile: Dockerfile
    container_name: smartops-data-processor
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hpc_simulation
      SPRING_DATASOURCE_USERNAME: hpc_user
      SPRING_DATASOURCE_PASSWORD: hpc_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      LOGGING_LEVEL_COM_SMARTOPS: INFO
    ports:
      - "8081:8080"  # Mapped to 8081 to avoid conflicts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    networks:
      - hpc-network
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '0.5'

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: hpc-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://hpc_user:hpc_password@postgres:5432/hpc_simulation
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      AI_SERVICE_URL: http://ai-service:8000
      JAVA_SERVICE_URL: http://data-processor:8080
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    volumes:
      - ./api-gateway/src:/app/src
      - ./api-gateway/package.json:/app/package.json
      - ./api-gateway/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    networks:
      - hpc-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      data-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s 
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartops-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_AI_SERVICE_URL: http://localhost:8000
      REACT_APP_JAVA_SERVICE_URL: http://localhost:8081
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
      - ai-service
      - data-processor
    restart: unless-stopped
    networks:
      - hpc-network

  # Simulation Worker (OMNeT++ Container)
  simulation-worker:
    build:
      # context: ./simulation-worker
      context: .
      dockerfile: simulation-worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://hpc_user:hpc_password@postgres:5432/hpc_simulation
      WORKER_CONCURRENCY: 2
      LOG_LEVEL: info
    volumes:
      - ./simulation-worker/src:/app/src
      - ./legacy-simulator:/app/legacy-simulator
      - simulation_results:/app/results
    networks:
      - hpc-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
      # resources:
      #   limits:
      #     memory: 2G
      #     cpus: '1.0'

  # pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hpc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hpc-simulation.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - hpc-network
    depends_on:
      - postgres
    profiles:
      - development

  # Redis Commander for Redis management (development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hpc-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    networks:
      - hpc-network
    depends_on:
      - redis
    profiles:
      - development

  # Prometheus for metrics (monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: hpc-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - hpc-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Grafana for visualization (monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: hpc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_PASSWORD: smartops123
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - hpc-network
    depends_on:
      - prometheus
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  simulation_results:
    driver: local

networks:
  hpc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16