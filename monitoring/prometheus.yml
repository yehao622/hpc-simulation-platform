# prometheus.yml - Minimal configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Java Data Processor
  - job_name: 'data-processor'
    static_configs:
      - targets: ['data-processor:8080']
    metrics_path: '/api/actuator/prometheus'
    scrape_interval: 30s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
